services:
  api:
    build: .
    env_file: .env
    command: uvicorn backitup.api:app --app-dir backend --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./secrets:/app/secrets:ro
    networks:
      - vps_proxy
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    env_file: .env
    command: alembic upgrade head
    volumes:
      - ./secrets:/app/secrets:ro

  scheduler:
    build: .
    env_file: .env
    command: python -m backitup.scheduler
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    env_file: .env
    command: python -m backitup.worker
    volumes:
      - ./secrets:/app/secrets:ro
      - worker-scratch:/app/.state/work
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - vps_proxy
    depends_on:
      - api

volumes:
  worker-scratch:

networks:
  vps_proxy:
    external: true
    name: vps_proxy
