[project]
name = "backitup"
version = "0.1.0"
description = "Hosted GitHub backup and recovery with BackItUp-managed storage"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3", "httpx>=0.28,<1", "boto3>=1.35,<2",
  "cryptography>=44", "PyJWT[crypto]>=2.10,<3", "zstandard>=0.23,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9", "moto[s3]>=5,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/backitup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL or R2-compatible storage", "live: opt-in disposable live-provider tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependencies are intentionally declared in endpoint signatures.
